[package]
name = "tatum-mcp"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "MCP server exposing the tatum-core DSL: docs, parameter registry, check and render"
build = "build.rs"

[[bin]]
name = "tatum-mcp"
path = "src/main.rs"

[dependencies]
tatum-core = { path = "../core" }
tatum-debug = { path = "../debug" }
serde_json = "1"
