# What a pull request has to pass. Each step is a guarantee the repo already
# relies on; the comments say which.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the run for the one before it worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The workspace builds with zero warnings; keep it there.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build, test, corpus, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # cpal (tatum play / watch) links against ALSA on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: No audio files in the repo
        # Renders are build artifacts; 145 MB of them once rode into a PR.
        run: |
          if git ls-files '*.wav' | grep .; then
            echo "::error::WAV files are build artifacts and must not be tracked"
            exit 1
          fi

      # Release speed, everything. The suite is DSP, and unoptimized DSP is
      # about five times slower: in debug the tests took twelve minutes, and
      # the callback-budget and audit tests needed release anyway, so they
      # built the workspace a second time. One build now serves all of it.
      # The `ci` profile is release without fat LTO (see Cargo.toml).
      - name: Build
        run: cargo build --workspace --locked --profile ci

      - name: Test
        # The suite includes the bar-timing, live-session and no-allocation
        # tests; the counting allocator only proves anything when it runs.
        # nextest runs every test binary at once; `cargo test` runs the fifty
        # of them one after another, and a handful of full-song renders set
        # the pace. There are no doctests for it to miss. `audit_baseline` has
        # jobs of its own, below. The whole-song renders are `#[ignore]`d:
        # they write WAVs to listen to, and what they check in CI -- sound,
        # no NaN, no clipping -- `mix.rs` checks on eight bars of every
        # example.
        run: cargo nextest run --workspace --locked --cargo-profile ci -E 'not binary(realtime_budget) and not binary(audit_baseline)'

      - name: The engine still fits in an audio callback
        # Alone, and after the rest: the budget is a timing, and with the
        # whole suite rendering on the other cores it would measure them.
        run: cargo nextest run --workspace --locked --cargo-profile ci -E 'binary(realtime_budget)' --no-capture

      - name: Every song in the corpus compiles
        # The corpus is the spec by example: a DSL change that breaks one of
        # these songs is a breaking change.
        run: |
          fails=0
          for f in examples/*.synth examples/rigs/*.synth; do
            if ! ./target/ci/tatum check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::does not compile"
              ./target/ci/tatum check "$f" 2>&1 | head -20
              fails=$((fails + 1))
            fi
          done
          echo "$fails failures"
          test "$fails" -eq 0

      - name: Every set walks end to end
        # A set is a rig plus twenty overlays resolved through `use`. It
        # breaks in ways a single file cannot: a renamed track in the rig
        # silently drops a voice from every step that overrides it.
        run: |
          fails=0
          for d in sets/*/; do
            if ! ./target/ci/tatum set check "$d" >/dev/null 2>&1; then
              echo "::error::set $d does not check"
              ./target/ci/tatum set check "$d" 2>&1 | head -20
              fails=$((fails + 1))
            fi
          done
          echo "$fails failures"
          test "$fails" -eq 0

      - name: docs/PARAMS.md is what `tatum params` prints
        # The reference is generated; a stale copy documents parameters that
        # do not exist (it missed a range change for two weeks).
        run: ./target/ci/tatum params | diff - docs/PARAMS.md

  audit:
    name: audit baseline (${{ matrix.song }})
    # `tatum audit` measures how much of each voice is not at a harmonic of
    # its note, and three songs have their numbers checked in -- nothing else
    # would notice a filter that began ringing or a saturator that got
    # hotter. It is as much CPU as the rest of the suite together, and a
    # runner for a private repo has two cores, so each song gets a runner of
    # its own instead of sharing them with the other tests.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        song: [detroit, liquid_dnb, neon_arterial]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo nextest run -p tatum-cli --locked --cargo-profile ci -E 'binary(audit_baseline) and test(${{ matrix.song }})'

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The browser runs the same core; `no_std` is only proven by this target.
      - run: cargo build -p tatum-wasm --target wasm32-unknown-unknown --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # The workspace is at zero warnings. This step is what keeps it there;
      # it used to count them into the run summary and pass regardless. The
      # five allows left in the tree each say in a comment why the lint's
      # suggestion is worse than the code.
      - run: cargo clippy --workspace --locked -- -D warnings
