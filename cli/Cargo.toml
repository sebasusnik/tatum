[package]
name = "tatum-cli"
version = "0.1.0"
edition = "2021"
description = "tatum: check, play, watch, render and debug .synth songs from the terminal"
license.workspace = true
repository.workspace = true

[[bin]]
name = "tatum"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
midir = "0.11.0"
tatum-core = { path = "../core" }
tatum-debug = { path = "../debug" }
